[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anther-ml"
version = "0.1.0"
description = "Two-phase music similarity and clustering pipeline (librosa + MERT)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "librosa>=0.10",
    "soundfile",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "umap-learn",
    "pynndescent",   # Tier 2A — approximate-kNN dedupe at 100k+ scale
    "hdbscan",
    # Workstream D — Leiden graph community detection
    "leidenalg",
    "python-igraph",
    # Workstream I — EBU R128 loudness normalization
    "pyloudnorm",
    "torch>=2.1",
    "transformers>=4.40",
    "accelerate",
    "matplotlib",
    "seaborn",
    "tqdm",
    # ui/ — Flask atlas app
    "flask",
    "requests",
    "werkzeug",
]

[project.optional-dependencies]
notebooks = ["jupyter", "ipykernel"]
dev = ["pytest"]
# music-mentor feature: QLoRA fine-tune + RAG + serving. torch/transformers
# are already core deps; this adds only the fine-tuning/serving stack.
mentor = [
    "peft",
    "trl",
    "bitsandbytes",
    "accelerate",
    "datasets",
    "sentence-transformers",
    "requests",
]

[tool.setuptools]
packages = ["anther_ml", "anther_ml.corpus", "anther_ml.corpus.tagging", "mentor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default suite excludes `stale` tests. These were written against the
# pre-multi-session atlas (module-global _graph/_link_keys/_query_vecs/_groups,
# GRAPH_PATH) that the per-session _SessionState refactor removed; they error at
# fixture setup and have not been ported. Run them explicitly with
# `pytest -m stale` if/when you rewrite them against the session model.
addopts = "-m 'not stale'"
markers = [
    "stale: test targets a removed pre-multi-session code path; excluded from the default run",
]
