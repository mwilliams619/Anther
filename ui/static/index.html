<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anther — Song Atlas</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<div class="app">

  <!-- ── Left panel: Search + Upload ──────────────────────────────────────── -->
  <div class="panel panel-left">
    <div class="header">
      <h1>Anther</h1>
      <span style="color:var(--muted);font-size:13px">song atlas</span>
    </div>

    <!-- Search -->
    <section>
      <h2>Search &amp; add</h2>
      <p class="hint-text">Corpus → Deezer → Spotify. Click a result to place it on the graph.</p>
      <div class="search-bar">
        <input id="search-input" type="text" placeholder="Artist, track…" autocomplete="off" />
      </div>
      <div id="search-results" style="margin-top:10px">
        <div class="empty">Search for a song to add it to the atlas</div>
      </div>
    </section>

    <!-- Upload -->
    <section>
      <h2>Upload a track</h2>
      <div id="upload-zone">
        <p style="margin-bottom:8px">Drag &amp; drop audio here</p>
        <label>or <span>browse files</span>
          <input type="file" id="upload-input" multiple accept=".mp3,.wav,.flac,.m4a" />
        </label>
        <p style="margin-top:6px;font-size:11px">MP3, WAV, FLAC, M4A · max 25 MB each</p>
      </div>
      <div id="place-status" class="place-status"></div>
    </section>
  </div>

  <!-- ── Graph ────────────────────────────────────────────────────────────── -->
  <div class="graph-wrap">
    <svg id="graph"></svg>
    <div class="graph-hint">drag nodes · scroll to zoom · hover to explore · ♦ = your songs</div>
  </div>

</div><!-- .app -->

<div id="graph-tooltip"></div>
<div id="error-toast"></div>

<script src="https://d3js.org/d3.v4.js"></script>
<script src="/static/graph.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
