name: Deploy staging (feature branches)

# Deploys an opted-in feature branch to the second worktree + port (5001),
# reachable via the staging subdomain once the cloudflared ingress rule from
# private/CI_CD_SETUP.md is added. Runs on the same self-hosted runner as
# deploy-stable.yml since it's the only place that can reach the box behind
# the tunnel.
#
# SECURITY — why this workflow is shaped the way it is:
#
#   The runner is self-hosted on the production box and has passwordless
#   sudo for `systemctl restart`. It previously checked out the *pushed*
#   branch and ran that branch's copy of scripts/deploy/deploy_staging.sh,
#   on `branches-ignore` (i.e. every branch). On a public repo that means
#   anyone who can push a branch — or anyone who obtains a token that can —
#   gets arbitrary code execution as the deploy user by editing the deploy
#   script itself. Two changes narrow that:
#
#     1. The deploy script is checked out from `master` (the default branch)
#        and run from there. The pushed branch supplies the *code to deploy*,
#        never the logic that does the deploying.
#     2. `branches` (opt-in prefixes) replaces `branches-ignore`, so pushing
#        an arbitrary branch name no longer starts a deploy at all. Use the
#        workflow_dispatch button for a one-off branch outside the prefixes.
#
#   Residual risk, accepted and documented: deploy_staging.sh runs the
#   *branch's* pytest smoke subset before restarting the service, so a
#   deployed branch still executes its own code (tests and conftest.py) on
#   the box. That is inherent to "test the branch before serving it".
#   Containing it properly needs an ephemeral or containerised runner, which
#   is host configuration rather than anything this file can express.
on:
  push:
    branches:
      - 'staging/**'
      - 'feature/**'
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy to staging"
        required: true

concurrency:
  group: deploy-staging
  cancel-in-progress: true   # a newer push should win — the previous
                             # in-progress staging deploy is superseded, not
                             # queued behind (unlike stable, staging has no
                             # "don't interrupt a live deploy" requirement)

jobs:
  deploy:
    runs-on: [self-hosted, anther]
    steps:
      # Trusted deploy logic only. Deliberately NOT the pushed branch — see
      # the security note above. The branch being deployed is fetched by
      # deploy_staging.sh itself, into the staging worktree.
      - name: Checkout trusted deploy scripts (master)
        uses: actions/checkout@v4
        with:
          ref: master
          path: _trusted_deploy

      - name: Deploy to staging
        # The branch name goes through the environment, not through ${{ }}
        # interpolation into the shell line: a branch name is attacker-chosen
        # text, and interpolating it directly builds a command out of it.
        env:
          TARGET_BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
        run: _trusted_deploy/scripts/deploy/deploy_staging.sh "$TARGET_BRANCH"
